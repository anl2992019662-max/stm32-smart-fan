<text x="65" y="883" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#425f73" font-weight="400" text-anchor="start">自动模式 PA8 有效极性及 DHT11 初始化存在版本差异，参见 docs/VERSION_NOTES.md。</text>
